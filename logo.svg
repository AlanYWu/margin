<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120"
     role="img" aria-label="Margin" preserveAspectRatio="xMinYMid meet">
  <title>Margin</title>
