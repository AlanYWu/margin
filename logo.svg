<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120"
     role="img" aria-label="Margin" preserveAspectRatio="xMinYMid meet">
  <title>Margin</title>
  <desc>Wordmark: a thin vertical rule — the page margin where every citation lives — followed by the name set in Fraunces.</desc>
  <rect x="6" y="20" width="3" height="80" fill="currentColor"/>
  <text x="34" y="92"
        font-family="'Fraunces', 'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-weight="500"
        font-size="92"
        letter-spacing="-2"
        fill="currentColor">Margin</text>
</svg>
